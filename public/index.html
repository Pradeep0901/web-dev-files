<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web App Deployment</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <div class="card">
        <p class="tag">Deployment Status</p>
        <h1>Application is Live</h1>
        <p>
          This app is deployed successfully and is ready to be validated via HTTP.
        </p>
        <button id="healthBtn">Check health</button>
        <div id="statusBox" class="status-box">Waiting for validation...</div>
      </div>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
